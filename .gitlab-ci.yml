stages:
  - check

project_structure_check:
  stage: check
  script:
    - |
      echo "Proje yapisi kontrol ediliyor..."

      if [ -d "vivado" ]; then
        echo "vivado klasoru bulundu"
      else
        echo "HATA: vivado klasoru yok"
        exit 1
      fi

      if [ -d "Vitis_project" ]; then
        echo "Vitis_project klasoru bulundu"
      else
        echo "HATA: Vitis_project klasoru yok"
        exit 1
      fi

      if [ -f "README.md" ]; then
        echo "README bulundu"
      else
        echo "HATA: README.md yok"
        exit 1
      fi

      echo "Temel kontroller basarili"