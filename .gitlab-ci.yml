stages:
  - validate
  - lint
  - test
  - report

validate_structure:
  stage: validate
  script:
    - echo "Repo yapisi kontrol ediliyor"
    - test -d vivado
    - test -d Vitis_project
    - test -f README.md
    - echo "Yapi kontrolu tamam"

lint_repo:
  stage: lint
  script:
    - echo "Dosya kontrolu yapiliyor"
    - find vivado -type f | head
    - find Vitis_project -type f | head
    - echo "Lint benzeri kontrol tamam"

test_repo:
  stage: test
  script:
    - echo "Temel testler basladi"
    - test -n "$(find vivado -type f)"
    - test -n "$(find Vitis_project -type f)"
    - echo "Temel testler tamam"

report_summary:
  stage: report
  script:
    - echo "Pipeline basariyla tamamladi"
    - echo "Vivado, Vitis_project ve README kontrol edildi"