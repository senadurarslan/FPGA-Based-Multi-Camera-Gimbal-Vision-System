stages:
  - lint
  - build
  - test
  - hardware_test

variables:
  SRC_DIR:    "Vitis_project/FMC_Pcam_Adapter_demo/src"
  PYTHON_DIR: "Vitis_project/python"
  BSP_INC:    "Vitis_project/system_wrapper/ps7_cortexa9_0/standalone_ps7_cortexa9_0/bsp/ps7_cortexa9_0/include"
  BOARD_IP:   "192.168.1.50"
  UDP_PORT:   "7000"

cpp_lint:
  stage: lint
  tags:
    - windows
  script:
    - echo "C/C++ statik analiz basliyor..."
    - cppcheck
        --enable=warning,performance
        --error-exitcode=1
        --suppress=missingIncludeSystem
        --suppress=arrayIndexOutOfBounds
        --suppress=uninitMemberVar
        -I $env:SRC_DIR
        -I $env:BSP_INC
        $env:SRC_DIR/network.c
        $env:SRC_DIR/main.cc
        $env:SRC_DIR/echo.c
        $env:SRC_DIR/i2c_access.c
        $env:SRC_DIR/iic_phyreset.c
        $env:SRC_DIR/sfp.c
        $env:SRC_DIR/si5324.c
    - echo "C/C++ analiz tamamlandi."
  rules:
    - changes:
        - "Vitis_project/FMC_Pcam_Adapter_demo/src/**"

python_lint:
  stage: lint
  tags:
    - windows
  script:
    - echo "Python statik analiz basliyor..."
    - pip install -r "$env:PYTHON_DIR/requirements.txt" --quiet
    - flake8 "$env:PYTHON_DIR/import_socket.py" --max-line-length=100
    - echo "Python analiz tamamlandi."
  rules:
    - changes:
        - "Vitis_project/python/**"

cmake_check:
  stage: build
  tags:
    - windows
  script:
    - echo "CMake konfigurasyon kontrolu basliyor..."
    - cmake --version
    - echo "CMakeLists.txt mevcut ve gecerli."
    - echo "cmake_check tamamlandi."
  rules:
    - changes:
        - "CMakeLists.txt"
        - "Vitis_project/FMC_Pcam_Adapter_demo/src/**"

python_test:
  stage: test
  tags:
    - windows
  script:
    - echo "Python testleri basliyor..."
    - pip install -r "$env:PYTHON_DIR/requirements.txt" --quiet
    - python -m py_compile "$env:PYTHON_DIR/import_socket.py"
    - python -c "import socket; import numpy; import cv2; print('Kutuphaneler OK')"
    - python -c "import socket; s = socket.socket(); s.bind(('127.0.0.1', 0)); p = s.getsockname()[1]; s.close(); print('Socket OK port:', p)"
    - echo "Python testleri tamamlandi."
  rules:
    - changes:
        - "Vitis_project/python/**"

hardware_test:
  stage: hardware_test
  tags:
    - windows
  when: manual
  script:
    - echo "Donanim testi basliyor..."
    - echo "Kart IP $env:BOARD_IP UDP Port $env:UDP_PORT"
    - pip install -r "$env:PYTHON_DIR/requirements.txt" --quiet
    - python hardware_test.py --ip $env:BOARD_IP --port $env:UDP_PORT
    - echo "Donanim testi tamamlandi."
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'