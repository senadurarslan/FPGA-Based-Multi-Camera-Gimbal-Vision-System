stages:
  - lint
  - build
  - test

variables:
  SRC_DIR: "Vitis_project/FMC_Pcam_Adapter_demo/src"
  PYTHON_DIR: "Vitis_project/python"

# ─────────────────────────────────────────
# LINT
# ─────────────────────────────────────────

python_lint:
  stage: lint
  tags:
    - windows
  script:
    - pip install flake8 --quiet
    - flake8 "$env:PYTHON_DIR/import_socket.py" --max-line-length=100
  rules:
    - changes:
        - "Vitis_project/python/import_socket.py"

cpp_lint:
  stage: lint
  tags:
    - windows
  script:
    - cppcheck --enable=warning --error-exitcode=1 --suppress=missingIncludeSystem --suppress=arrayIndexOutOfBounds --suppress=uninitMemberVar -I $env:SRC_DIR $env:SRC_DIR/network.c $env:SRC_DIR/main.cc $env:SRC_DIR/echo.c $env:SRC_DIR/i2c_access.c $env:SRC_DIR/iic_phyreset.c $env:SRC_DIR/sfp.c $env:SRC_DIR/si5324.c
  rules:
    - changes:
        - "Vitis_project/FMC_Pcam_Adapter_demo/src/**"

# ─────────────────────────────────────────
# BUILD (CMake)
# ─────────────────────────────────────────

cmake_build:
  stage: build
  tags:
    - windows
  script:
    - echo "CMake build basliyor..."
    - cmake --version
    - mkdir -p build
    - cd build
    - cmake .. -G "MinGW Makefiles" -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
    - cmake --build . --config Release
    - echo "CMake build tamamlandi."
  rules:
    - changes:
        - "Vitis_project/FMC_Pcam_Adapter_demo/src/**"
        - "CMakeLists.txt"

# ─────────────────────────────────────────
# TEST
# ─────────────────────────────────────────

python_test:
  stage: test
  tags:
    - windows
  script:
    - python -m py_compile "$env:PYTHON_DIR/import_socket.py"
    - python -c "import socket; s = socket.socket(); s.bind(('127.0.0.1', 0)); p = s.getsockname()[1]; s.close(); print('Socket OK port:', p)"
  rules:
    - changes:
        - "Vitis_project/python/**"